services:
  postgres:
    image: postgres:16-alpine
    container_name: words-app-postgres
    restart: unless-stopped
    ports:
      - '${DB_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-words_app}
    volumes:
      - words_app_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-words_app}']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  words_app_pgdata:
