name: Web

on:
  push:
    branches: [main]
    paths:
      - 'words-web-app/**'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'words-web-app/**'
      - '.github/workflows/web.yml'

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web · lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: words-web-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: words-web-app/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
